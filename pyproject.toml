[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-ingestion"
version = "0.1.0"
description = "Read-only Calendar action extraction and local reporting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1.2,<2", "requests>=2.31,<3"]

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.setuptools.packages.find]
include = ["second_brain*"]
